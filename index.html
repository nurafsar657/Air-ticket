<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Air Ticket Booking</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-600 via-sky-500 to-cyan-400 py-10 px-4">

    <div class="max-w-4xl mx-auto">

        <!-- Header -->
        <div class="text-center text-white mb-8">

            <h1 class="text-4xl md:text-5xl font-bold">
                ✈ Air Ticket Booking
            </h1>

            <p class="mt-3 text-blue-100 text-lg">
                Book your flight quickly and easily
            </p>

        </div>


        <!-- Booking Form -->
        <div class="bg-white rounded-2xl shadow-2xl p-6 md:p-10">

            <form class="space-y-6">


                <!-- Personal Information -->
                <div class="bg-blue-50 border border-blue-100 rounded-xl p-6">

                    <h2 class="text-xl font-bold text-gray-800 mb-5 border-b border-blue-200 pb-3">
                        Personal Information
                    </h2>


                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">


                        <!-- Full Name -->
                        <div>

                            <label 
                                for="fullname"
                                class="block text-sm font-semibold text-gray-700 mb-2"
                            >
                                Full Name
                            </label>

                            <input 
                                type="text"
                                id="fullname"
                                name="fullname"
                                placeholder="Enter your full name"
                                required
                                class="w-full bg-white border border-blue-200 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                            >

                        </div>


                        <!-- Email -->
                        <div>

                            <label 
                                for="email"
                                class="block text-sm font-semibold text-gray-700 mb-2"
                            >
                                Email Address
                            </label>

                            <input 
                                type="email"
                                id="email"
                                name="email"
                                placeholder="example@email.com"
                                required
                                class="w-full bg-white border border-blue-200 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                            >

                        </div>


                        <!-- Phone -->
                        <div>

                            <label 
                                for="phone"
                                class="block text-sm font-semibold text-gray-700 mb-2"
                            >
                                Phone Number
                            </label>

                            <input 
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="+880 1XXXXXXXXX"
                                required
                                class="w-full bg-white border border-blue-200 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                            >

                        </div>


                        <!-- Passengers -->
                        <div>

                            <label 
                                for="passengers"
                                class="block text-sm font-semibold text-gray-700 mb-2"
                            >
                                Number of Passengers
                            </label>

                            <input 
                                type="number"
                                id="passengers"
                                name="passengers"
                                min="1"
                                max="10"
                                value="1"
                                required
                                class="w-full bg-white border border-blue-200 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                            >

                        </div>

                    </div>

                </div>



                <!-- Flight Information -->
                <div class="bg-sky-50 border border-sky-100 rounded-xl p-6">

                    <h2 class="text-xl font-bold text-gray-800 mb-5 border-b border-sky-200 pb-3">
                        Flight Information
                    </h2>


                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">


                        <!-- From -->
                        <div>

                            <label 
                                for="from"
                                class="block text-sm font-semibold text-gray-700 mb-2"
                            >
                                From
                            </label>

                            <input 
                                type="text"
                                id="from"
                                name="from"
                                placeholder="Departure city"
                                required
                                class="w-full bg-white border border-sky-200 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                            >

                        </div>


                        <!-- To -->
                        <div>

                            <label 
                                for="to"
                                class="block text-sm font-semibold text-gray-700 mb-2"
                            >
                                To
                            </label>

                            <input 
                                type="text"
                                id="to"
                                name="to"
                                placeholder="Destination city"
                                required
                                class="w-full bg-white border border-sky-200 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                            >

                        </div>


                        <!-- Departure Date -->
                        <div>

                            <label 
                                for="departure"
                                class="block text-sm font-semibold text-gray-700 mb-2"
                            >
                                Departure Date
                            </label>

                            <input 
                                type="date"
                                id="departure"
                                name="departure"
                                required
                                class="w-full bg-white border border-sky-200 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                            >

                        </div>


                        <!-- Return Date -->
                        <div>

                            <label 
                                for="return"
                                class="block text-sm font-semibold text-gray-700 mb-2"
                            >
                                Return Date
                            </label>

                            <input 
                                type="date"
                                id="return"
                                name="return"
                                class="w-full bg-white border border-sky-200 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                            >

                        </div>

                    </div>

                </div>



                <!-- Travel Class -->
                <div class="bg-purple-50 border border-purple-100 rounded-xl p-6">

                    <h2 class="text-xl font-bold text-gray-800 mb-5 border-b border-purple-200 pb-3">
                        Travel Class
                    </h2>


                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">


                        <!-- Economy -->
                        <label class="bg-white border border-purple-200 rounded-lg p-4 cursor-pointer hover:border-purple-500 hover:bg-purple-100 transition">

                            <input 
                                type="radio"
                                id="economy"
                                name="class"
                                value="Economy"
                                checked
                                class="accent-purple-600"
                            >

                            <span class="ml-2 font-medium text-gray-700">
                                Economy
                            </span>

                        </label>


                        <!-- Business -->
                        <label class="bg-white border border-purple-200 rounded-lg p-4 cursor-pointer hover:border-purple-500 hover:bg-purple-100 transition">

                            <input 
                                type="radio"
                                id="business"
                                name="class"
                                value="Business"
                                class="accent-purple-600"
                            >

                            <span class="ml-2 font-medium text-gray-700">
                                Business
                            </span>

                        </label>


                        <!-- First Class -->
                        <label class="bg-white border border-purple-200 rounded-lg p-4 cursor-pointer hover:border-purple-500 hover:bg-purple-100 transition">

                            <input 
                                type="radio"
                                id="first"
                                name="class"
                                value="First Class"
                                class="accent-purple-600"
                            >

                            <span class="ml-2 font-medium text-gray-700">
                                First Class
                            </span>

                        </label>

                    </div>

                </div>



                <!-- Additional Services -->
                <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-6">

                    <h2 class="text-xl font-bold text-gray-800 mb-5 border-b border-indigo-200 pb-3">
                        Additional Services
                    </h2>


                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">


                        <!-- Meal -->
                        <label class="flex items-center bg-white border border-indigo-200 rounded-lg p-4 cursor-pointer hover:bg-indigo-100 hover:border-indigo-400 transition">

                            <input 
                                type="checkbox"
                                id="meal"
                                name="service"
                                value="Meal"
                                class="w-4 h-4 accent-indigo-600"
                            >

                            <span class="ml-3 font-medium text-gray-700">
                                🍽 Meal
                            </span>

                        </label>


                        <!-- Extra Luggage -->
                        <label class="flex items-center bg-white border border-indigo-200 rounded-lg p-4 cursor-pointer hover:bg-indigo-100 hover:border-indigo-400 transition">

                            <input 
                                type="checkbox"
                                id="luggage"
                                name="service"
                                value="Extra Luggage"
                                class="w-4 h-4 accent-indigo-600"
                            >

                            <span class="ml-3 font-medium text-gray-700">
                                🧳 Extra Luggage
                            </span>

                        </label>


                        <!-- Travel Insurance -->
                        <label class="flex items-center bg-white border border-indigo-200 rounded-lg p-4 cursor-pointer hover:bg-indigo-100 hover:border-indigo-400 transition">

                            <input 
                                type="checkbox"
                                id="insurance"
                                name="service"
                                value="Travel Insurance"
                                class="w-4 h-4 accent-indigo-600"
                            >

                            <span class="ml-3 font-medium text-gray-700">
                                🛡 Travel Insurance
                            </span>

                        </label>

                    </div>

                </div>



                <!-- Special Request -->
                <div class="bg-orange-50 border border-orange-100 rounded-xl p-6">

                    <label 
                        for="message"
                        class="block text-xl font-bold text-gray-800 mb-4"
                    >
                        Special Request
                    </label>


                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Write your special request here..."
                        class="w-full bg-white border border-orange-200 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-orange-400 focus:border-orange-400 resize-none transition"
                    ></textarea>

                </div>



                <!-- Buttons -->
                <div class="flex flex-col sm:flex-row gap-4 pt-3">


                    <button
                        type="submit"
                        class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-semibold text-lg hover:bg-blue-700 transition duration-300 shadow-lg hover:shadow-xl"
                    >
                        ✈ Book Flight
                    </button>



                    <button
                        type="reset"
                        class="flex-1 bg-white border border-gray-300 text-gray-700 py-3 rounded-lg font-semibold text-lg hover:bg-gray-100 transition duration-300"
                    >
                        Reset
                    </button>

                </div>


            </form>

        </div>


        <!-- Footer -->
        <p class="text-center text-blue-100 mt-6 text-sm">
            © 2026 Air Ticket Booking. All rights reserved.
        </p>


    </div>

</body>
</html>
